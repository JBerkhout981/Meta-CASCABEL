################################################################################
#                             CONFIGURATION FILE                               #
#------------------------------------------------------------------------------#
# Configuration file for the Metagenomic Analysis Workflow.                    #
# Set the parameters below, save the file and run snakemake.                   #
# The file format is yaml (http://www.yaml.org/) In this file, you only need   #
# to overwrite settings according to your needs, most values are already       #
# pre-configured. It is very important to keep the indentation of the file     #
# (don’t change the tabs and spaces), as well as the name of the               #
# parameters/variables. But you can change the values of the parameters to     #
# deviate from the default settings. Any text after a hash tag is considered a #
# comment and will be ignored by snakemake.                                    #
#                                                                              #
# Author: Alejandro Abdala, Julia Engelmann and Juliette Berkhout              #
# Date: 30/10/2026                                                             #
# Version: 5.1                                                                 #
################################################################################

################################################################################
#                       GENERAL PARAMS SECTION                                 #
#------------------------------------------------------------------------------#
# The general parameters section defines variables that are global or general  #
# for the complete work-flow execution, as well as extra information for the   #
# report generation.                                                           #
################################################################################

#------------------------------------------------------------------------------#
#                       Project Name                                           #
#=======================DESCRIPTION============================================#
# The name of the project for which the pipe line will be executed.            #
#------------------------------------------------------------------------------#
PROJECT: ""

#------------------------------------------------------------------------------#
#                       RUN                                                    #
#=======================DESCRIPTION============================================#
# Name of the RUN - Only use alphanumeric characters and don't use spaces.     #
# This argument helps the user to execute different runs (pipeline execution)  #
# with the same input data but with different parameters (ideally).            #
# The RUN variable can be set here or remain empty, in the latter case, the    #
# user must assign this value via the command line --config RUN=User_run_name  #
#------------------------------------------------------------------------------#
RUN: ""

#------------------------------------------------------------------------------#
#                       Description                                            #
#=======================DESCRIPTION============================================#
# Brief description for the pipeline. Any description written here will be     #
# included on the final report. This field is not mandatory so it can remain   #
# empty                                                                        #
#------------------------------------------------------------------------------#
description: ""

#------------------------------------------------------------------------------#
#                       SAMPLES                                                #
#=======================DESCRIPTION============================================#
# SAMPLES/Libraries you will like to include on the analysis                   #
# Same sample names used with input.txt script                                 #
# Include all the names between quotes, and comma separated                    #
#------------------------------------------------------------------------------#
SAMPLES: []

#------------------------------------------------------------------------------#
#                       INPUT FILES                                            #
#=======================DESCRIPTION============================================#
# You can configure the input fiels in two ways:                               #
# - If you want to analyse one sample, fill in 'fw_reads' and rv_reads' and    #
#   leave 'input_files' empty                                                  #
# - If you want to analyse more than one sample, leave 'fw_reads' and          #
#   'rv_reads' empty and fill in 'input_files'                                 #
#=======================PARAMS=================================================#
# fw_reads              Full path to raw reads in forward direction            #
# rv_reads              Full path to raw reads in reverse direction            #
# input_files           If you are analysing more than 1 metagenome create a   #
#                       txt file and put the name here (this can be any name)  #
#                       An example of the .txt file is on Redmine              #
#------------------------------------------------------------------------------#
fw_reads: ""
rv_reads: ""
input_files: ""

#------------------------------------------------------------------------------#
#                       INPUT TYPE                                             #
#=======================DESCRIPTION============================================#
# This pipeline supports two types of input files, fastq and gzipped fastq     #
# files.                                                                       #
# The option gzip_input can take the values "T" if the input files are gziped  #
# (only the reads!, the metadata file always needs to be uncompressed) or "F"  #
# if the input files are regular fastq files                                   #
#------------------------------------------------------------------------------#
gzip_input: "T"

#------------------------------------------------------------------------------#
#                       Execution mode                                         #
#=======================DESCRIPTION============================================#
# Set this flag to T (default) in order to interact at some specific steps with#
# the pipeline. For a list for all the "interactive" checkpoints take a look   #
# into the following link: TBD                                                 #
#------------------------------------------------------------------------------#
interactive: "F"

#------------------------------------------------------------------------------#
#                       Remove intermediate output files                       #
#=======================DESCRIPTION============================================#
# Set this flag to T (default) in order to remove all intermediate output      #
# files and directories at the end of the snakemake run.                       #
# cleanUp_log.txt contains a list of all the removed files.                    #
#------------------------------------------------------------------------------#
remove_intermediate_output: "T"

################################################################################
#                       Specific Parameters Section                            #
#=======================DESCRIPTION============================================#
# In this section of the configuration file, you can find all the values used  #
# to run the different rules during the pipeline execution.                    #
#                                                                              #
# Some of the parameters below, contains an option called "extra_params".      #
# This option is designed to allow the user to enter any other extra parameter #
# available on the program to be executed, therefore if the default            #
# configuration of the pipeline doesn't consider some particular user desired  #
# argument, it can be specified on the extra_params section for each rule      #
#------------------------------------------------------------------------------#

#------------------------------------------------------------------------------#
#                       Quality control                                        #
# rule: sequali and sequali_trimmed_reads                                      #
# environment: sequali_v1.0.2                                                  #
#=======================DESCRIPTION============================================#
# Sequence quality metrics for FASTQ and uBAM files.                           #
#=======================PARAMS=================================================#
# onRawReads            'T' Run QC steps on raw reads                          #
#                       'F' Don't run QC steps on raw reads                    #
# onTrimmedReads        'T' Run QC steps on trimmed reads                      #
#                       'F' Don't run QC steps on trimmed reads                #
# threads               Number of threads to run sequali.                      #
# extra_params          Extra parameters.                                      #
#=======================INFORMATION============================================#
# https://sequali.readthedocs.io/en/latest/#quickstart                         #
# Or do: sequali -h                                                            #
#------------------------------------------------------------------------------#
sequali:
  onRawReads: "F"
  onTrimmedReads: "F"
  threads: 10
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Trimmomatic                                            #
# rule: trimmomatic                                                            #
# environment: trimmomatic_v0.39                                               #
#=======================DESCRIPTION============================================#
# Remove adapter contamination and trim very low quality parts (ends) of the   #
# reads. Use maxinfo 0.6 for Q trimming.                                       #
#=======================PARAMS=================================================#
# trimming              'T' if you want to trim the reads                      #
#                       'F' if you don't want to trim your reads               #
# mode PE               The data type is paired reads                          #
# threads               Number of threads                                      #       
# type (clip)           'ILLUMINACLIP' Find and remove Illumina adapters       #
# adapter               path to a fasta file containing all the adapters       #
# seed                  The maximum mismatch count                             #
# palindrome_ct         Accuracy threshold for paired-end adapter detection    #
# simple_ct             Accuracy threshold for adapter detection               #
# minAdpLength          Minimum adapter length to detect                       #
# keepBoth              'TRUE' keep both reads after adapter removal           #
#                       'FALSE' don't keep both reads after adapter removal    #
# type (sliding)        "SLIDINGWINDOW" Trim reads based on average quality in #
#                       a sliding window                                       #
# windowSize            Number of bases in the sliding window                  #
# requiredQuality       Minimum average quality in the sliding window          #
# type (maxinfo)        "MAXINFO" Perform an adaptive quality trim             #
# targetLength          Specify the target read length                         #
# strictness            Number between 0 and 1. A low value favours longer     #
#                       reads, while a high value favours read correctness     #
# type (minlen)         "MINLEN" Specify minimum read length                   #
# len                   Removes reads shorter than the specified length        #
# extra_params          Extra parameters                                       #
#=======================INFORMATION============================================#
#usadellab.org/cms/uploads/supplementary/Trimmomatic/TrimmomaticManual_V0.32.pdf
# Or do: trimmomatic PE                                                        #
#------------------------------------------------------------------------------#
trimm: 
  trimming: "T"
  mode: "PE"
  threads: 15
  clip:
    type: "ILLUMINACLIP"
    adapter: "resources/adapters/TruSeq3-PE-2.fa"
    seed: 1
    palindrome_ct: 30
    simple_ct: 10
    minAdpLength: 5
    keepBoth: "TRUE"
  sliding:
    type: "SLIDINGWINDOW"
    windowSize: 5
    requiredQuality: 22
  maxinfo:
    type: "MAXINFO"
    targetLength: 40
    strictness: 0.6
  minlen:
    type: "MINLEN"
    len: 100
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Analysis Type                                          #
#=======================DESCRIPTION============================================#
# Some metagenomic analysis use the contigs and some others the scaffolds in   #
# order to perform the mapping, binning and other downstream analysis after the#
# assembly. The following variable can take two values: CONTIGS or SCAFFOLDS   #
# So deppending on this, the pipeline will continue the analysis with the      #
# assembled contigs or with the assembled scaffolds.                           #
#=======================PARAMS=================================================#
# ANALYSIS              'CONTIGS' continue the analysis using the contigs      #
#                       'SCAFFOLDS' continue the analysis using the scaffolds  #
#=======================NOTE===================================================#
# Not all assembly tools generate scaffolds, if you wan't to use scaffolds,    #
# chose either SPADES or IDBA as assembly tool.                                #
#------------------------------------------------------------------------------#
ANALYSIS: ""

#------------------------------------------------------------------------------#
#                       Select assembly tool                                   #
#=======================DESCRIPTION============================================#
# This option allows the user to choose between different assemblers.          #
#=======================PARAMS=================================================#
# ASSEMBLER             Chose one of the following (case sensitive):           #
# - SPADES              This option runs spades                                #
# - IDBA                This option runs IDBA                                  #
# - MEGAHIT             This option runs Megahit                               #
# - ASSEMBLED           Use "ASSEMBLED" if you already have contigs and want   #
#                       to skip Meta-CASCABEL assembly steps.                  #
# contigs               If ASSEMBLER = "ASSEMBLED" supply file pointing to     #
#                       contigs/scaffolds                                      #
#------------------------------------------------------------------------------#
ASSEMBLER: ""
contigs: ""

#------------------------------------------------------------------------------#
#                       Assembly with SPADES                                   #
# rule: meta_spades_merged, meta_spades                                        #
# environment: spades_v3.15.5                                                  #
#=======================DESCRIPTION============================================#
# Assembly using spades, always try to use it with nice in order to avoid the  #
# program to take a lot a memory! The nice parameter is used for this purpose. #
# It ranges from minus 20 to plus 19 and can take on only integer values. A    #
# value of minus 20 represents the highest priority level, whereas 19          #
# represents the lowest.                                                       #
#=======================PARAMS=================================================#
# nice                  To avoid take all the resources. It ranges from minus  #
#                       20 to plus 19 and can take on only integer values. A   #
#                       value of minus 20 represents the highest priority      #
#                       level, whereas 19 represents the lowest.               #
# threads               Number of threads                                      #
# memory                RAM limit for SPADES in Gb (terminates if exceeded)    #
# kmers                 Comma-separated list of k-mer sizes (must be odd and   #
#                       less than 128). Default: 'auto'                        #
# merge_paired_reads    'T' to merge reads before assembling                   #
#                       'F' don't merge reads before assembling                #
# extra_params          Any extra params.                                      #
#=======================INFORMATION============================================#
# https://ablab.github.io/spades/                                              #
# Or do: spades.py -h                                                          #
#------------------------------------------------------------------------------#
spades:
  nice: "5"
  threads: "25"
  memory: "350"
  kmers: "21,33,55,77"
  merge_paired_reads: "F"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Assembly with MEGAHIT                                  #
# rule: megahit                                                                #
# environment: megahit_v1.2.9                                                  #
#=======================DESCRIPTION============================================#
# MEGAHIT is a single node assembler for large and complex metagenomics NGS    #
# reads, such as soil. It makes use of succinct de Bruijn graph (SdBG) to      #
# achieve low memory assembly.                                                 #
# Choosing k                                                                   #
# MEGAHIT uses multiple k-mer strategy. Minimum k, maximum k and the step for  #
# iteration can be set by options --k-min, --k-max and --k-step respectively.  #
# k must be odd numbers while the step must be an even number.                 #
# for ultra complex metagenomics data such as soil, a larger kmin, say 27, is  #
# recommended to reduce the complexity of the de Bruijn graph. Quality trimming#
# is also recommended for high-depth generic data, large --k-min (25 to 31) is #
# recommended smaller --k-step, say 10, is more friendly to low-coverage       #
# datasets                                                                     #
#=======================PARAMS=================================================#
# kmin                  Minimum kmer size (<= 255), must be odd number.        #
# kmax                  Maximum kmer size (<= 255), must be odd number.        #
# kstep                 Increment of kmer size of each iteration (<= 28),      #
#                       must be even number.                                   #
# memory                Max memory in byte to be used in SdBG construction,    #
#                       setqbetween 0-1, fraction of the machine's total memory#
# cpus                  Number of CPU threads.                                 #
# extra_params          Any extra argument to be passed.                       #
#=======================INFORMATION============================================#
# https://github.com/voutcn/megahit/wiki/Assembly-Tips                         #
# Or do:  megahit -h                                                           #
#------------------------------------------------------------------------------#
megahit:
  kmin: 21
  kmax: 141
  kstep: 10
  memory: 0.3
  cpus: 35
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Assembly with IDBA_UD                                  #
# rule: idba                                                                   #
# environment: idba_v1.1.3                                                     #
#=======================DESCRIPTION============================================#
# IDBA is the basic iterative de Bruijn graph assembler for second-generation  #
# sequencing reads. IDBA-UD, an extension of IDBA, is designed to utilize      #
# paired-end reads to assemble low-depth regions and use progressive depth on  #
# contigs to reduce errors in high-depth regions.                              #
#=======================PARAMS=================================================#
# mink                  minimum k value (<=312)                                #
# maxk                  maximum k value (<=312)                                #
# step                  Increment of k-mer of each iteration                   #
# threads               Number of threads                                      #
# extra_params          Any extra argument to be passed.                       #
#=======================INFORMATION============================================#
# https://manpages.debian.org/unstable/idba/idba_ud.1.en.html                  #
# Or do: idba_ud                                                               #
#------------------------------------------------------------------------------#
idba:
  mink: "20"
  maxk: "100"
  step: "10"
  threads: "35"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Split assembly                                         #
# rule: split_assembly                                                         #
#=======================DESCRIPTION============================================#
# This option allows the user to split the contig file. According to CONCOCT   #
# documentation, in order to give more weight to larger contigs and mitigate   #
# the effect of assembly errors we cut up the contigs into chunks of 10 Kb.    #
# The final chunk is appended to the one before it if it is < SPLIT_SIZE Kb to #
# prevent generating small contigs. This means that no contig < SPLIT_SIZE*2 Kb#
# is cut up.                                                                   #
# We recommend to set this to true whenever the pipeline is running for CONCOCT#
#=======================PARAMS=================================================#
# SPLIT_ASSEMBLY        'T' to split contigs/scaffolds                         #
#                       'F' don't split the contigs/scaffolds                  #
# SPLIT_SIZE            Chunk size (in bases) for splitting. Option -c within  #
#                       CONCOCT's script cut_up_fasta.py -c.                   #
#=======================NOTE===================================================#
# The quality assesment is performed on the pre-splitted contigs/scaffolds.    #
# The original, unsplitted contig or scaffolds files will be renamed as:       #
# contigs.complete.fasta or scaffolds.complete.fasta                           #
#------------------------------------------------------------------------------#
SPLIT_ASSEMBLY: "F"
SPLIT_SIZE: 20000

#------------------------------------------------------------------------------#
#                       QUAST                                                  #
# rule: quast_contigs and quast_scaffolds                                      #
# environment: quast_v5.2.0                                                    #
#=======================DESCRIPTION============================================#
# QUality ASsessment Tool for Genome Assemblies                                #
#=======================PARAMS=================================================#
# threads               Number of threads                                      #
# extra_params          Any extra argument to be passed.                       #
#=======================INFORMATION============================================#
# https://github.com/ablab/quast                                               #
# Or do: quast --help                                                          #
#------------------------------------------------------------------------------#
quast:
  threads: "20"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       BWA MEM                                                #
# rule: bwa_index, bwa_mem, bwa_mem_mtx and sam_flags                          #
# environment: bwa-fastalign_v1.0.0_samtools_v1.24                             #
#=======================DESCRIPTION============================================#
# To generate bam files as input for binning, several steps are performed      #
# using bwa-fastalign and samtools. These are the following:                   #
#     1. Indexing the assembly                                                 #
#     2. Mapping the trimmed reads against the indexed assembly per sample     #
#        (When differential_coverage_matrix: F)                                #
#     OR                                                                       #
#     2. Mapping the trimmed reads of all samples against each indexed assembly#
#        (When differential_coverage_matrix: T)                                #
#     3. Generating .flagstat files of all the bam files, these files contain  #
#        counts for each flagstat and are used to summarize the bwa results for#
#        the report file.                                                      #
#=======================PARAMS=================================================#
# nice                  To avoid take all the resources. It ranges from minus  #
#                       20 to plus 19 and can take on only integer values. A   #
#                       value of minus 20 represents the highest priority      #
#                       level, whereas 19 represents the lowest.               #
# threads               Number of threads                                      #
# differential_coverage_matrix       'T' A cross sample depth file is created  #            
#                                    'F' A single sample depth file is created #
#=======================NOTE===================================================#
# The differential_coverage_matrix == T mode works for all binning tools exept #
# SemiBin2. Semibin2 will still perform binning in single sample mode          #
#=======================INFORMATION============================================#
# https://github.com/zzhofict/BWA-FastAlign                                    #
# https://www.htslib.org/doc/1.10/samtools-flagstat.html                       #
# Or do: bwa-fastalign                                                         #
# Or do: samtools                                                              #
#------------------------------------------------------------------------------#
bwa:
  nice: "5"
  threads: "12"
  differential_coverage_matrix: "F"

#------------------------------------------------------------------------------#
#                       jgi_summarize_bam_contig_depths                        #
# rule: summarize_bam                                                          #
# environment: metabat_v2.18                                                   #
#=======================DESCRIPTION============================================#
# This program is a command from Metabat and generates a depth file from BAM   #
# files. It runs with all the default parameters, however the extra_params     #
# variable is present in order to include an desired option.                   #
# This step is skipped for SemiBin2.                                           #
#=======================INFORMATION============================================#
# https://gensoft.pasteur.fr/docs/MetaBAT/2.15/                                #
# Or do: jgi_summarize_bam_contig_depths -h                                    #
#------------------------------------------------------------------------------#
jgi_summ:
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Select the binning tool                                #
#=======================DESCRIPTION============================================#
# Here, you can select the binning method of your choice.                      #
#=======================PARAMS=================================================#
# BINNING               Available options are (case sensitive):                #
# - METABAT             this option runs Metabat2                              #
# - MAXBIN              this option run MaxBin2                                #
# - CONCOCT             this option runs Concoct                               #
# - BINSANITY           this option runs BinSanity workflow                    #
# - SEMIBIN             This option runs semibin2                              #
# - DAS                 this option runs multiple binning tools then refines   #
#                       bins with DASTool. In DAS Tool in the configfile you   #
#                       can chose which binning tools to run                   #                          
#=======================NOTES==================================================#
# - Binsanity and CONCOCT are the most memory inefficient binning tools        #
# - After selecting the target method, you can fine tune the options for each  #
#   tool, using the options below.                                             #
# - When using DAS, it will always run Metabat2 as one of the binning tools    #
#------------------------------------------------------------------------------#
BINNING: ""

#------------------------------------------------------------------------------#
#                       DAS Tool                                               #
# rule: das                                                                    #
# environment: dasTool_v1.1.5                                                  #
#=========DESCRIPTION==========================================================#
# DAS Tool is an automated method that integrates the results of a flexible    #
# number of binning algorithms to calculate an optimized, non-redundant set of #
# bins from a single assembly.                                                 #
#=======================PARAMS=================================================#
# threads               Number of threads                                      #
# db                    Directory of single copy gene database.                #
# search_engine         Engine used for single copy gene identification        #
#                       [blast/diamond/usearch].                               #
# extra_params          Any extra params                                       #
# run                   'T' for all the binning tools you want to use          #
#                       'F' for all the binning tools you don't want to use    #
# gtdbtk_analysis       'T' to perform gtdbtk analysis for this binning tool   #
#                       'F' skip gtdbtk analysis for this binning tool         #
# checkm_analysis       'T' to perform checkm analysis for this binning tool   #
#                       'F' skip checkm analysis for this binning tool         #
#=======================NOTES==================================================#
# - Binsanity and CONCOCT are the most memory inefficient binning tools        #
# - Das will always run Metabat2 as one of the binning tools (hence why there  #
#   is no 'run' option for metabat)                                            #
# - The checkM and gtdbtk analys only work if 'run' is set to 'T' for the tool #
#=======================INFORMATION============================================#
# https://github.com/cmks/DAS_Tool                                             #
# Or do: DAS_Tool -h                                                           #
#------------------------------------------------------------------------------#
das:
  threads: "20"
  db: "/export/lv13/databases/DAS_tool/release-1.1.7/"
  search_engine: diamond
  extra_params: ""
  metabat:
    gtdbtk_analysis: "F"
    checkm_analysis: "F"
  binsanity: 
    run: "F"
    gtdbtk_analysis: "F"
    checkm_analysis: "F"
  concoct: 
   run: "F"
   gtdbtk_analysis: "F"
   checkm_analysis: "F"
  maxbin: 
    run: "F"
    gtdbtk_analysis: "F"
    checkm_analysis: "F"
  semibin:
    run: "F"
    gtdbtk_analysis: "F"
    checkm_analysis: "F"

#------------------------------------------------------------------------------#
#                       MetaBAT2                                               #
# rule: metabat                                                                #
# environment: metabat_v2.18                                                   #
#=======================DESCRIPTION============================================#
# Metagenome Binning based on Abundance and Tetranucleotide frequency          #
#=======================PARAMS=================================================#
# threads               Number of threads to use                               #
# min_contig            Minimum size of a contig for binning. Should be >=1500 #
# min_score             Minimum score of a edge for binning.                   #
#                       Should be between 1 and 99, greater = more specific.   #
# maxP                  Percentage of 'good' contigs considered for binning    #
#                       decided by connection among contigs.                   #
#                       The greater, the more sensitive.                       #
# maxEdge               Maximum number of edges per node.                      # 
#                       The greater, the more sensitive.                       #
# min_bin_size          Minimum size of a bin as the output.                   #
# extra_params          Any extra params.                                      #
#=======================INFORMATION============================================#
# https://gensoft.pasteur.fr/docs/MetaBAT/2.15/                                #
# Or do: metabat2 -h                                                           #
#------------------------------------------------------------------------------#
metabat2:
  threads: "20"
  min_contig: "2500"
  min_score: "60"
  maxP: "95"
  maxEdge: "200"
  min_bin_size: "200000"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       MaxBin                                                 #
# rule: maxbin                                                                 #
# environment: maxbin_v2.2.7                                                   #
#=======================DESCRIPTION============================================#
# MaxBin uses the nucleotide composition information and contig abundance      #
# information to do achieve binning through an Expectation-Maximization        # 
# algorithm.                                                                   #
#=======================PARAMS=================================================#
# threads               Number of threads                                      #
# min_contig_length     minimum contig length. Default is 1000bp.              #
# max_iteration         maximum Expectation-Maximization algorithm iteration   #
#                       number.                                                #
# prob_threshold        Probability threshold for EM final classification.     #
# plotmarker            '-plotmarker' to generate plot with marker abundance   #
#                       or leave empty to skip plot generation                 #
# markerset             Marker gene sets, 107 (default) or 40.                 #
#                       By default MaxBin will look for 107 marker genes present
#                       in >95% of bacteria. Alternatively you can also choose #
#                       40 marker gene sets that are universal among bacteria  #
#                       and archaea                                            #
# extra_params          Any extra params.                                      #
#=======================INFORMATION============================================#
# https://github.com/galsang-git/maxbin2/blob/main/README.txt                  #
# Or do: run_MaxBin.pl                                                         #
#------------------------------------------------------------------------------#
maxbin:
  threads: "20"
  min_contig_length: "2500"
  max_iteration: "50"
  prob_threshold: "0.9"
  plotmarker: "-plotmarker"
  markerset: "107"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       concoct                                                #
# rule: concoct                                                                #
# environment: concoct                                                         #
#=======================DESCRIPTION============================================#
# CONCOCT does unsupervised binning of metagenomic contigs by using nucleotide #
# composition kmer frequencies and coverage data for multiple samples.         #
# CONCOCT can accurately (up to species level) bin metagenomic contigs.        #
#=======================PARAMS=================================================#
# min_contig_length     Minimum contig length. Default is 1000bp.              #
# max_iteration         Specify maximum number of iterations for the binning   #
#                       proces (VBGM)                                          #
# threads               Number of threads to use                               #
# extra_params          Any extra params.                                      #
#=======================INFORMATION============================================#
# https://concoct.readthedocs.io/en/latest/index.html                          #
# Or do: concoct -h                                                            #
#------------------------------------------------------------------------------#
concoct:
  min_contig_length: "2500"
  max_iteration: "500"
  threads: "20"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       BinSanity_wf                                           #
# rule: binsanity                                                              #
# environment: binsanity_v0.5.4                                                #
#=======================DESCRIPTION============================================#
# BinSanity contains a suite a scripts designed to cluster contigs generated   #
# from metagenomic assembly into putative genomes. What makes BinSanity unique #
# is the usage of Affinity Propagation (AP) and its biphasic approach.         #
# The biphasic approach whereby contigs are clustered initially with contig    #
# coverage followed by refinement using GC% and k-mer frequencies yields more  #
# complete bins than similar methods.                                          #
#=======================PARAMS=================================================#
# preference            Specify a preference. Note: decreasing the             #
#                       preference leads to more lumping, increasing will lead #
#                       to more splitting. If your range of coverages are low  #
#                       you will want to decrease the preference, if you have  #
#                       10 or less replicates increasing the preference could  #
#                       benefit you.                                           #
# min_contig_length     Specify the contig size cut-off. Default is 1000bp.    #
# threads               Number of threads to use                               #
# low_completion        T or F. BinSanity WF output two different kind of bins:#
#                       "refined" bins (high quality) bins and also low        #
#                       completion bins. Use T to include low comp. bins in    #
#                       downstream analysis 
# extra_params          Any extra params.                                      #
#=======================INFORMATION============================================#
# https://github.com/edgraham/BinSanity/wiki                                   #
# Or do: Binsanity-wf -h                                                       #
#------------------------------------------------------------------------------#
binsanity:
  preference: -3
  min_contig_length: 2500
  threads: 20
  low_completion: "F"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Semibin2                                               #
# rule: semibin                                                                #
# environment: semibin_v2.4.0                                                  #
#=======================DESCRIPTION============================================#
# SemiBin is a command tool for metagenomic binning with deep learning, using  #
# Siamese Neural networks.                                                     #
#=======================PARAMS=================================================#
# threads               Number of threads you want to use                      #
# min_bin_size          Minimum bin size in kilo-basepairs                     #
# max_edge              The maximum number of edges that can be connected to   #
#                       one contig                                             #
# min_len               Minimal length for contigs in binning. Default: SemiBin#
#                       chooses 1000bp or 2500bp according the ratio of the    #
#                       number of base pairs of contigs between 1000-2500bp    #
# extra_params          Any extra params                                       #
#=======================INFORMATION============================================#
# https://semibin.readthedocs.io/en/latest/subcommands/                        #
# Or do: SemiBin2 single_easy_bin -h                                           #
#------------------------------------------------------------------------------#
semibin:
  threads: "20"
  min_bin_size: "200"
  max_edge: "200"
  min_len: "2500"
  extra_params: ""

#------------------------------------------------------------------------------#
#                       Unbinned                                               #
# rule: get_unbinned and create_unbinned_fasta                                 #
#=======================DESCRIPTION============================================#
# Here you can chose if you want to get a fasta file containing all contigs or #
# scaffolds (depending on your 'ANALYSIS' choice in the config file)           #
#=======================PARAMS=================================================#
# CREATE_UNBINNED       'T' obtain all unbinned contigs/scaffolds              #
#                       'F' Don't obtain unbinned contigs/scaffolds            #
#------------------------------------------------------------------------------#
CREATE_UNBINNED: "F"

#------------------------------------------------------------------------------#
#                       checkM lineage_wf                                      #
# rule: checkM_<bin_method>                                                    #
# environment: checkm_v1.2.5                                                   #
#=======================DESCRIPTION============================================#
# This rule asseses the quality of genomes recovered from isolates, single     #
# cells or metagenomes.                                                        #
#=======================PARAMS=================================================#
# threads               Number of threads                                      #
# extra_params          Any extra params                                       #
#=======================INFORMATION============================================#
# https://github.com/Ecogenomics/CheckM/wiki/Workflows#lineage-specific-workflow
# Or do: checkm lineage_wf -h                                                  #
#------------------------------------------------------------------------------#
checkM:
  threads: "15" 
  extra_params: ""

#------------------------------------------------------------------------------#
#                       GTDB-Tk classify_wf                                    #
# rule: gtdbtk_<bin_method>                                                    #
# environment: gtdbtk_v2.7.2                                                   #
#=======================DESCRIPTION============================================#
# GTDB-Tk is a software toolkit for assigning objective taxonomic              #
# classifications to bacterial and archaeal genomes based on the Genome        #
# Database Taxonomy GTDB.                                                      #
#=======================PARAMS=================================================#
# cpus                  Number of CPUs                                         #
# extra_params          Any extra params                                       #
#=======================INFORMATION============================================#
# https://ecogenomics.github.io/GTDBTk/commands/classify_wf.html               #
# Or do: gtdbtk classify_wf --help                                             #
#------------------------------------------------------------------------------#
gtdbtk:
  cpus: "35"
  extra_params: ""
